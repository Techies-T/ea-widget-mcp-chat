name: Release PQC-Signed & Trivy-Scanned EA Widget Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write
  security-events: write

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Widget Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Audit Critical Vulnerabilities
        run: |
          npm ci
          npm audit --audit-level=critical

      - name: Build Widget Bundle
        run: npm run build

      - name: Configure AWS Credentials via GitHub OIDC (Zero Static Keys)
        if: ${{ secrets.AWS_KMS_SIGNER_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_KMS_SIGNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Sign Manifest & Bundle with PQC Hybrid (Ed25519 + AWS KMS ML-DSA-65)
        if: ${{ secrets.AWS_KMS_SIGNER_ROLE_ARN != '' && secrets.AWS_KMS_MLDSA65_KEY_ID != '' && secrets.EA_PLUGIN_PROD_ED25519_PRIVATE_KEY != '' }}
        env:
          AWS_KMS_MLDSA65_KEY_ID: ${{ secrets.AWS_KMS_MLDSA65_KEY_ID }}
          EA_PLUGIN_PROD_ED25519_PRIVATE_KEY: ${{ secrets.EA_PLUGIN_PROD_ED25519_PRIVATE_KEY }}
        run: |
          node scripts/sign-ci.cjs --dir . --mode aws-kms --repo "${{ github.repository }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build local image first (do not push until vulnerability scan passes)
      - name: Build Container Image for Security Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ea-widget-mcp-chat:scan

      # Step 2: Vulnerability Scan (OS packages + Node.js dependencies)
      - name: Scan Container Image with Trivy (Block on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ea-widget-mcp-chat:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Generate Trivy SARIF Report (HIGH & CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ea-widget-mcp-chat:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # Step 3 & 4: Push verified image to GHCR and sign image digest with Sigstore Cosign
      - name: Log in to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Image Repository Name (lowercase)
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          echo "image=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Push Verified Container Image to GHCR
        id: push
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Install Cosign (Sigstore)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@v3

      - name: Sign Container Image Digest with Cosign Keyless OIDC Certificate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE_DIGEST="${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "${IMAGE_DIGEST}"
          cat <<EOF > container-image.json
          {
            "widgetId": "mcp-chat",
            "version": "${{ steps.meta.outputs.tag }}",
            "image": "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}",
            "imageDigest": "${IMAGE_DIGEST}",
            "digest": "${{ steps.push.outputs.digest }}",
            "cosignSigned": true,
            "certificateOidcIssuer": "https://token.actions.githubusercontent.com",
            "certificateIdentityRegexp": "^https://github.com/${{ github.repository }}/.github/workflows/release-signed-plugin.yml@.*$",
            "trivyScanned": true,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Generate GitHub Sigstore Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/widget.manifest.json'

      - name: Package Signed Widget Artifact
        run: |
          tar -czf ea-widget-mcp-chat-${{ steps.meta.outputs.tag }}.tar.gz dist/ server/ package.json package-lock.json Dockerfile

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ea-widget-mcp-chat-${{ steps.meta.outputs.tag }}.tar.gz
            dist/widget.manifest.json
            container-image.json
          generate_release_notes: true
